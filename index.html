<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="https://static.igem.wiki/common/icons/favicons/igem-2022.svg"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_TEAM_NAME% - iGEM %VITE_TEAM_YEAR%</title>
    <link rel="stylesheet" href="/src/tailwind.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Cinematic hero shell (Home route only; hidden on other routes via body.is-wiki-page) -->
    <canvas
      id="hero-canvas"
      role="img"
      aria-label="Interactive 3D RNA model of SINEB2-ChromDel"
    ></canvas>

    <div class="hero-intro-stack">
      <div id="overlay">
        <h1>SINEB2–ChromDel</h1>
        <p>PekingHSC 2026</p>
      </div>
      <div id="click-hint">
        <span class="hint-ring"></span>
        <span class="hint-text" id="hint-text">Assembling the RNA machinery…</span>
      </div>
    </div>

    <div id="hero-showcase-tagline" class="hero-showcase-tagline" aria-hidden="true">
      <h2 class="hero-showcase-tagline__title">Reprogramming Translation</h2>
      <p class="hero-showcase-tagline__lead">
        Overcoming payload limits to cure chromosomal microdeletions via AI-native SINEUPs
      </p>
    </div>

    <p id="scroll-explore-hint" class="scroll-explore-hint" aria-hidden="true">
      <span class="scroll-explore-hint__chev" aria-hidden="true"></span>
      <span class="scroll-explore-hint__text">Scroll to explore</span>
    </p>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
